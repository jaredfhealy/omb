name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for project Pages path
        env:
          VITE_PUBLIC_BASE_PATH: /omb/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_DRIVE_APPDATA_FILENAME: ${{ vars.VITE_GOOGLE_DRIVE_APPDATA_FILENAME }}
          VITE_GOOGLE_DRIVE_BACKUP_PREFIX: ${{ vars.VITE_GOOGLE_DRIVE_BACKUP_PREFIX }}
          VITE_GOOGLE_DRIVE_BACKUP_RETENTION: ${{ vars.VITE_GOOGLE_DRIVE_BACKUP_RETENTION }}
          VITE_GOOGLE_DRIVE_SCOPE: ${{ vars.VITE_GOOGLE_DRIVE_SCOPE }}
          VITE_GOOGLE_REDIRECT_URI: ${{ vars.VITE_GOOGLE_REDIRECT_URI }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
